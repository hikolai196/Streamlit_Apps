[project]
name = "transcription-app"
version = "0.3.0"
description = "Local Streamlit meeting transcription app (faster-whisper, batch, Docker)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.28.0",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "imageio-ffmpeg>=0.5.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-docx>=1.1.0",
    "srt>=3.5.3",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
gpu = [
    "torch",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "app"]

[tool.setuptools.packages.find]
include = ["modules*", "utils*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # Third-party libs still import stdlib modules removed in Python 3.13+.
    # Safe to ignore on 3.10–3.12; revisit if upgrading past 3.12.
    "ignore:.*audioop.*:DeprecationWarning:pydub.*",
    "ignore:.*aifc.*:DeprecationWarning:audioread.*",
    "ignore:.*sunau.*:DeprecationWarning:audioread.*",
]

[tool.coverage.run]
branch = true
source = ["modules", "utils", "config", "ui"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
