[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimage"
version = "0.4.0"
description = "Interactive Streamlit app for perspective deskewing of images"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.13"
dependencies = [
    "streamlit==1.40.0",
    "streamlit-drawable-canvas==0.9.3",
    "opencv-python-headless==4.13.0.92",
    "numpy==2.4.3",
    "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.setuptools.packages.find]
include = ["dimage*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["dimage", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["dimage"]
